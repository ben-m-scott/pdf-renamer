[project]
name = "pdf-renamer"
version = "2608.30.1"
description = "Automatically rename scientific PDF files using bibliographic information extracted from the document."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "requests",
    "pdfplumber",
    "PyPDF2",
]

[project.scripts]
pdf_renamer = "pdf_renamer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["pdf_renamer"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff.lint]
# BLE001: blind excepts are intentional - malformed PDFs must be skipped,
#         not crash the batch.
# DTZ005: only .year is used from datetime.now(); timezone is irrelevant.
# SIM103: needless-bool returns - kept for the file's explicit style.
# SIM102: collapsible nested ifs - kept for the file's explicit style.
ignore = [
    "BLE001",
    "DTZ005",
    "SIM103",
    "SIM102",
]
