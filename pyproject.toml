[project]
name = "pdf-renamer"
version = "2608.30"
description = "Automatically rename scientific PDF files using bibliographic information extracted from the document."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "requests",
    "pdfplumber",
    "PyPDF2",
]

[project.scripts]
pdf_renamer = "pdf_renamer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["pdf_renamer"]
